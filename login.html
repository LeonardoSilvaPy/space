<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <title>Login | Space</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="box">

    <h2>Entrar</h2>

    <input id="login" type="text" placeholder="Email ou usuário" />
    <input id="password" type="password" placeholder="Senha" />


    <button onclick="login()">Entrar</button>

    <p id="msg"></p>

    <button class="btn-google" onclick="loginWithGoogle()">
      <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg">
      Entrar com Google
    </button>

    <a href="javascript:void(0)" onclick="forgotPassword()" class="link">
      Esqueci minha senha
    </a>

    <a href="register.html" class="link">
      Não tem conta? Cadastre-se
    </a>

    <a href="index.html" class="btn-back">Voltar</a>

  </div>

  <script type="module" src="auth.js"></script>
</body>
</html>
